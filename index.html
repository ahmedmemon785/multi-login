<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https: data:;" />
  <title>Multi Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <aside id="sidebar">

    <div id="sidebar-header">
      <svg id="app-icon" viewBox="0 0 24 24" width="22" height="22" fill="none">
        <rect x="3"  y="3"  width="7" height="7" rx="1.5" fill="#14B8A6"/>
        <rect x="14" y="3"  width="7" height="7" rx="1.5" fill="#14B8A6" opacity=".55"/>
        <rect x="3"  y="14" width="7" height="7" rx="1.5" fill="#14B8A6" opacity=".55"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5" fill="#14B8A6" opacity=".25"/>
      </svg>
      <span id="app-title">Multi Login</span>
      <button id="collapse-btn" title="Collapse sidebar">
        <svg id="collapse-icon" viewBox="0 0 24 24" width="14" height="14" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
    </div>

    <div id="site-list"></div>

    <div id="sidebar-footer">
      <button id="add-site-btn" title="Add Site">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="4" x2="12" y2="20"/>
          <line x1="4"  y1="12" x2="20" y2="12"/>
        </svg>
        <span class="btn-label">Add Site</span>
      </button>
    </div>

  </aside>

  <!-- ── Main / empty state ──────────────────────────────── -->
  <main id="main-area">
    <div id="empty-state" style="display:none">
      <svg viewBox="0 0 24 24" width="52" height="52" fill="none">
        <rect x="3"  y="3"  width="7" height="7" rx="1.5" fill="#14B8A6" opacity=".5"/>
        <rect x="14" y="3"  width="7" height="7" rx="1.5" fill="#14B8A6" opacity=".3"/>
        <rect x="3"  y="14" width="7" height="7" rx="1.5" fill="#14B8A6" opacity=".3"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5" fill="#14B8A6" opacity=".15"/>
      </svg>
      <p class="empty-title">No site added yet</p>
      <p class="empty-sub">Click <strong>+ Add Site</strong> in the sidebar to get started.</p>
    </div>
  </main>

  <!-- ── Add Site modal ──────────────────────────────────── -->
  <div id="add-site-overlay" class="hidden">
    <div id="add-site-modal">
      <h2>Add Site</h2>
      <p class="modal-sub">Choose a preset or enter any URL, then give it a name.</p>
      <div id="preset-grid"></div>
      <div class="field-row">
        <label for="site-url-input">URL</label>
        <input id="site-url-input" type="url" placeholder="https://…" autocomplete="off" />
      </div>
      <div class="field-row">
        <label for="site-name-input">Name</label>
        <input id="site-name-input" type="text" placeholder="e.g. Discord, Stripe…"
               maxlength="40" autocomplete="off" />
      </div>
      <div class="modal-actions">
        <button class="btn-ghost"   id="add-site-cancel">Cancel</button>
        <button class="btn-primary" id="add-site-confirm" disabled>Add Site</button>
      </div>
    </div>
  </div>

  <!-- ── Simple modal (rename / confirm) ─────────────────── -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <h2 id="modal-title"></h2>
      <p  id="modal-desc"></p>
      <input id="modal-input" type="text" maxlength="40" autocomplete="off" />
      <div class="modal-actions">
        <button class="btn-ghost"   id="modal-cancel">Cancel</button>
        <button class="btn-primary" id="modal-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <!-- ── Toast container ─────────────────────────────────── -->
  <div id="toast-container"></div>

  <!-- ── Collapsed sidebar flyout (fixed, populated by JS) ── -->
  <div id="collapsed-flyout"></div>

  <script src="renderer.js"></script>
</body>
</html>
